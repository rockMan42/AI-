skills_dirs:
  - "app/hermes/skills"

tools_dirs:
  - "app/hermes/tools"

mcp_servers:
  enterprise_knowledge_mcp:
    command: python
    args:
      - "-m"
      - "app.hermes.mcp.knowledge_mcp_server"
    connect_timeout: 60
    timeout: 10
    tools:
      include:
        - knowledge_search

  oa_material_requisition_mcp:
    command: python
    args:
      - "-m"
      - "app.hermes.mcp.requisition_mcp_server"
    connect_timeout: 30
    timeout: 15
    tools:
      include:
        - list_categories
        - get_category_fields
        - submit_requisition
        - query_requisition
  finance_expense_mcp:
    command: python
    args:
      - "-m"
      - "app.hermes.mcp.finance_mcp_server"
    connect_timeout: 30
    timeout: 15
    tools:
      include:
        - submit_expense
        - query_expense
        - query_expense_status
  crm_lead_mcp:
    command: python
    args:
      - "-m"
      - "app.hermes.mcp.crm_mcp_server"
    connect_timeout: 30
    timeout: 15
    tools:
      include:
        - query_leads
        - get_lead_detail
        - update_follow_up