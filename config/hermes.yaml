skills_dirs:
  - "app/hermes/skills" # 技能目录（与旧版一致）
tools_dirs:
  - "app/hermes/tools"  # 自定义工具目录
mcp_servers:
  enterprise_knowledge_mcp:
    command: python
    args:
      - "-m"
      - "app.hermes.mcp.knowledge_mcp_server"
    connect_timeout: 60
    timeout: 10
    tools:
      include:
        - knowledge_search