name: lead_query
display_name: "查询客户线索"
description: "查询分配给当前用户的客户线索及跟进状态，支持按状态、优先级、时间范围筛选"
triggers:
  - "线索"
  - "客户"
  - "商机"
  - "跟进"
  - "新线索"
priority: 10
slots:
  - name: status
    type: string
    required: false
    default: null
    follow_up_prompt: "需要筛选哪种线索状态？（new/contacted/qualified/proposed/won/lost）"
    description: "线索状态，对应 t_lead.status"
    enum: ["new", "contacted", "qualified", "proposed", "won", "lost"]
  - name: priority
    type: string
    required: false
    default: null
    follow_up_prompt: "需要筛选哪个优先级？（高/中/低）"
    description: "优先级筛选，对应 t_lead.priority"
    enum: ["高", "中", "低"]
  - name: time_range
    type: string
    required: false
    default: null
    follow_up_prompt: "需要查询哪个时间范围？（今天/本周/本月/最近7天）"
    description: "时间范围筛选，用于过滤 t_lead.created_at 或 t_lead.next_followup"
    enum: ["今天", "本周", "本月", "最近7天"]
  - name: company_name
    type: string
    required: false
    default: null
    follow_up_prompt: "请提供要查询的客户公司名称"
    description: "按客户公司名称模糊搜索，对应 t_lead.company_name"
