name: leave_apply
display_name: "请假"
description: >
  收集请假信息并生成确认卡片，用户点击确认后才能提交。
  查询剩余年假、调休余额、病假余额应路由到 attendance_query。
triggers:
  - "请假"
  - "休假"
  - "年假"
  - "事假"
  - "病假"
  - "调休"
priority: 10
slots:
  - name: leave_type
    type: string
    required: true
    default: null
    follow_up_prompt: "请问请假类型是什么？（年假/调休/病假/事假）"
    description: "本次申请的请假类型"
    enum: ["年假", "调休", "病假", "事假"]

  - name: start_time
    type: date
    required: true
    default: null
    follow_up_prompt: "请问从哪一天开始请假？"
    description: "开始日期，YYYY-MM-DD，包含当天"

  - name: end_time
    type: date
    required: true
    default: null
    follow_up_prompt: "请问请假到哪一天结束？"
    description: "结束日期，YYYY-MM-DD，包含当天；只请一天时与开始日期相同"

  - name: reason
    type: string
    required: true
    default: null
    follow_up_prompt: "请简单说明请假理由。"
    description: "用户明确提供的请假理由，不得推测或编造"