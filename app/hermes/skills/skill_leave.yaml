name: leave_apply
display_name: "请假"
description: "处理员工请假申请，自动校验假期余额，根据审批流配置确定审批人"
triggers:
  - "请假"
  - "休假"
  - "年假"
  - "事假"
  - "病假"
  - "调休"
  - "婚假"
  - "产假"
priority: 10
slots:
  - name: leave_type
    type: string
    required: true
    default: null
    follow_up_prompt: "请问请假类型是什么？（事假/病假/年假/婚假/产假/调休）"
    description: "假别，对应 t_leave_request.leave_type"
    enum: ["事假", "病假", "年假", "婚假", "产假", "调休"]
  - name: start_time
    type: datetime
    required: true
    default: null
    follow_up_prompt: "请问从什么时候开始请假？"
    description: "请假开始时间，对应 t_leave_request.start_time"
  - name: end_time
    type: datetime
    required: true
    default: null
    follow_up_prompt: "请问请假到什么时候结束？"
    description: "请假结束时间，对应 t_leave_request.end_time"
  - name: duration
    type: float
    required: false
    default: null
    follow_up_prompt: "请问一共请假多少天？"
    description: "请假天数，对应 t_leave_request.duration，可由系统自动计算"
  - name: reason
    type: string
    required: false
    default: null
    follow_up_prompt: "方便简单说明一下请假理由吗？"
    description: "请假原因，对应 t_leave_request.reason"
