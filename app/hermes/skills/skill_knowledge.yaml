name: policy_query
display_name: "查询制度"
description: "根据企业知识库回答规章制度、操作手册和常见问题"
triggers:
  - "制度"
  - "规定"
  - "标准"
  - "流程"
  - "手册"
  - "怎么弄"
  - "怎么办"
  - "文档"
priority: 10
slots:
  - name: query_topic
    type: string
    required: true
    default: null
    follow_up_prompt: "请提供你要查询的具体问题。"
    description: "用户的完整知识查询问题，保留原话中的条件、数字和限制，不要压缩为关键词"