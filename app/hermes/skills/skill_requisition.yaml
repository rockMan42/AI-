name: requisition_apply
display_name: "申领物资"
description: "处理办公用品、IT设备、劳保用品等物资申领；按品类规则动态补齐字段并发送确认卡片。"
triggers:
  - "申领"
  - "领用"
  - "申请物资"
  - "办公用品"
  - "领一台"
  - "领一个"
  - "打印纸"
  - "电脑"
priority: 10

# 全部字段必须在静态 YAML 中声明，LLM 才能在首轮提取。
# 是否必填由 t_category_field_rule 动态覆盖。
slots:
  - name: item_category
    type: string
    required: true
    default: null
    follow_up_prompt: "请问您要申领什么品类？（办公用品/IT设备/劳保用品/其他）"
    description: "物资分类"
    enum: ["办公用品", "IT设备", "劳保用品", "其他"]

  - name: item_name
    type: string
    required: false
    default: null
    description: "物资名称"

  - name: specification
    type: string
    required: false
    default: null
    description: "规格型号"

  - name: quantity
    type: integer
    required: false
    default: null
    description: "申领数量"

  - name: reason
    type: string
    required: false
    default: null
    description: "申领原因"

  - name: purpose
    type: string
    required: false
    default: null
    description: "用途说明"

  - name: expected_return_date
    type: date
    required: false
    default: null
    description: "预计归还日期，格式 YYYY-MM-DD"