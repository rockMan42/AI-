[project]
name = "ai-digital-employee"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.137.*",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "aiomysql>=0.2",
    "redis[hiredis]>=5.0",
    "pymilvus>=2.5",
    "pydantic-settings>=2.0",
    "hermes-agent==0.19.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "python-multipart>=0.0.20,<1",
    "pymupdf>=1.26,<1.27",
    "python-docx>=1.2,<1.3",
    "minio>=7.2,<8",
    "tiktoken>=0.11,<1",
    "pyjwt[crypto]>=2.10,<3",
    "mcp==1.26.0",
    "cryptography==46.0.7",
    "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]